<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sitelbra</title>
<style>
:root{
  --bg:#ffffff; --side:#f7f7f5; --hover:#efefed; --active:#e8e8e6;
  --text:#37352f; --muted:#787774; --line:#e9e9e7;
  --ok-bg:#edf3ec; --ok-tx:#1c3829; --ok-ic:#448361;
  --bad-bg:#fbe4e4; --bad-tx:#5d1715; --bad-ic:#e03e3e;
  --warn-bg:#fbf3db; --warn-tx:#402c1b;
  --field:#ffffff; --mark:rgba(224,62,62,.22);
  --font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,"Apple Color Emoji",Arial,sans-serif,"Segoe UI Emoji";
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#191919; --side:#202020; --hover:#2a2a2a; --active:#333333;
    --text:#ebebeb; --muted:#9b9b9b; --line:#2f2f2f;
    --ok-bg:#1f2e26; --ok-tx:#cfe8d8; --ok-ic:#4dab9a;
    --bad-bg:#3b2323; --bad-tx:#f4cfcf; --bad-ic:#ff7369;
    --warn-bg:#35301f; --warn-tx:#f0e2b8;
    --field:#202020; --mark:rgba(255,115,105,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#191919; --side:#202020; --hover:#2a2a2a; --active:#333333;
  --text:#ebebeb; --muted:#9b9b9b; --line:#2f2f2f;
  --ok-bg:#1f2e26; --ok-tx:#cfe8d8; --ok-ic:#4dab9a;
  --bad-bg:#3b2323; --bad-tx:#f4cfcf; --bad-ic:#ff7369;
  --warn-bg:#35301f; --warn-tx:#f0e2b8;
  --field:#202020; --mark:rgba(255,115,105,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100%}
.side{width:240px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.ws{display:flex;align-items:center;gap:8px;padding:6px 10px;font-weight:600;font-size:14px;border-radius:6px}
.ws .logo{width:22px;height:22px;border-radius:5px;background:var(--text);color:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700}
.sec{padding:14px 10px 4px;font-size:12px;color:var(--muted);font-weight:500}
.nav{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;color:var(--text);font:inherit;font-size:14px;padding:5px 10px;border-radius:6px;cursor:pointer;text-align:left}
.nav:hover{background:var(--hover)}
.nav[aria-current="page"]{background:var(--active);font-weight:500}
.nav:focus-visible,.btn:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid #2383e2;outline-offset:1px}
.main{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:8px;padding:10px 24px;font-size:14px;color:var(--muted);border-bottom:1px solid transparent}
.top b{color:var(--text);font-weight:400}
.menu{display:none;border:0;background:none;color:var(--text);font-size:18px;padding:4px 8px;border-radius:6px;cursor:pointer}
.menu:hover{background:var(--hover)}
.page{max-width:820px;margin:0 auto;padding:48px 24px 96px}
.icon{font-size:64px;line-height:1;margin-bottom:12px}
h1{font-size:40px;line-height:1.2;font-weight:700;margin:0 0 8px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 32px;max-width:62ch}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.field{width:100%;font-family:var(--mono);font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--text);resize:vertical;min-height:46px;box-shadow:rgba(15,15,15,.04) 0 1px 2px inset}
.field::placeholder{color:var(--muted);opacity:.7}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin:16px 0 8px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text);margin:0;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:#2383e2}
.btns{display:flex;gap:8px;margin-left:auto}
.btn{font:inherit;font-size:14px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.pri{background:#2383e2;border-color:#2383e2;color:#fff}
.btn.pri:hover{background:#0b6ec5}
.callout{display:flex;gap:12px;padding:16px;border-radius:6px;margin-top:24px}
.callout .e{font-size:22px;line-height:1.3}
.callout strong{display:block;font-size:17px}
.callout.idle{background:var(--side);color:var(--muted)}
.callout.ok{background:var(--ok-bg);color:var(--ok-tx)}
.callout.bad{background:var(--bad-bg);color:var(--bad-tx)}
.callout.warn{background:var(--warn-bg);color:var(--warn-tx)}
.callout p{margin:2px 0 0;font-size:15px}
h2{font-size:24px;font-weight:600;margin:40px 0 12px}
.diff{border:1px solid var(--line);border-radius:6px;padding:12px 14px;overflow-x:auto;font-family:var(--mono);font-size:17px}
.diff .ln{display:flex;align-items:baseline;gap:12px;white-space:pre}
.diff .ln+.ln{margin-top:6px}
.diff .tag{font-family:var(--font);font-size:12px;color:var(--muted);width:56px;flex:none}
.ch{display:inline-block;min-width:1ch;padding:0 1px;border-radius:3px}
.ch.d{background:var(--mark);color:var(--bad-ic);font-weight:700}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:14px;border-top:0;border-bottom:1px solid var(--line)}
td.m{font-family:var(--mono)}
.hint{font-size:14px;color:var(--muted);margin-top:8px}
@media (max-width:760px){
  .side{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:transform .18s ease;padding-top:calc(12px + env(safe-area-inset-top,0px));box-shadow:rgba(0,0,0,.2) 0 0 24px}
  .side.open{transform:none}
  .menu{display:block}
  .top{padding:8px 12px}
  .page{padding:24px 16px 72px}
  h1{font-size:30px}.icon{font-size:48px}
  .grid{grid-template-columns:1fr}
  .btns{margin-left:0}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Menu">
    <div class="ws"><span class="logo">S</span>Sitelbra</div>
    <div class="sec">Ferramentas</div>
    <div id="navList"></div>
  </aside>
  <div class="main">
    <div class="top">
      <button class="menu" id="menuBtn" aria-label="Abrir menu">☰</button>
      <span>Sitelbra</span><span>/</span><b id="crumb"></b>
    </div>
    <main class="page" id="view"></main>
  </div>
</div>

<script>
/* ---------- Registro de ferramentas ----------
   Para adicionar uma função nova: inclua um objeto neste array
   com id, icon, name e render(container). O menu se monta sozinho. */
const tools = [
  { id:'comparador', icon:'🏷️', name:'Comparador de código de barras', render:renderComparador }
];

const $ = (s,r=document)=>r.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function buildNav(activeId){
  const list = $('#navList'); list.innerHTML='';
  tools.forEach(t=>{
    const b = document.createElement('button');
    b.className='nav'; b.innerHTML = `<span>${t.icon}</span><span>${t.name}</span>`;
    if(t.id===activeId) b.setAttribute('aria-current','page');
    b.onclick=()=>{ location.hash = t.id; $('#side').classList.remove('open'); };
    list.appendChild(b);
  });
}
function route(){
  const id = (location.hash||'').replace('#','');
  const t = tools.find(x=>x.id===id) || tools[0];
  buildNav(t.id); $('#crumb').textContent = t.name;
  const v = $('#view'); v.innerHTML=''; t.render(v);
}
window.addEventListener('hashchange',route);
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');

/* ---------- Comparador de código de barras ---------- */
function eanCheck(code){
  if(!/^\d+$/.test(code)) return null;
  if(![8,12,13,14].includes(code.length)) return null;
  const d = code.split('').map(Number), last = d.pop();
  let sum = 0;
  d.reverse().forEach((n,i)=>{ sum += n * (i%2===0 ? 3 : 1); });
  const calc = (10 - sum%10)%10;
  return { ok: calc===last, expected: calc };
}
const tipo = n => ({8:'EAN-8',12:'UPC-A',13:'EAN-13',14:'GTIN-14'}[n]||null);

function renderComparador(root){
  root.innerHTML = `
    <div class="icon">🏷️</div>
    <h1>Comparador de código de barras</h1>
    <p class="lead">Digite ou escaneie dois códigos. O resultado aparece na hora, com a posição exata de cada diferença.</p>

    <div class="grid">
      <div><label for="a">Código A</label><textarea class="field" id="a" rows="1" spellcheck="false" autocomplete="off" placeholder="7891000100103"></textarea></div>
      <div><label for="b">Código B</label><textarea class="field" id="b" rows="1" spellcheck="false" autocomplete="off" placeholder="7891000100103"></textarea></div>
    </div>

    <div class="row">
      <label class="chk"><input type="checkbox" id="optSp" checked> Ignorar espaços, hifens e pontos</label>
      <label class="chk"><input type="checkbox" id="optCase"> Diferenciar maiúsculas de minúsculas</label>
      <div class="btns">
        <button class="btn" id="swap" type="button">Trocar A e B</button>
        <button class="btn" id="clear" type="button">Limpar</button>
      </div>
    </div>

    <div id="result"></div>
    <div id="details"></div>
    <p class="hint">Dica: com um leitor de código de barras, escaneie o primeiro, o leitor aperta Enter e o cursor vai para o segundo.</p>
  `;
  const a=$('#a',root), b=$('#b',root), sp=$('#optSp',root), cs=$('#optCase',root);

  const norm = s => {
    let x = s.replace(/[\r\n]+/g,'').trim();
    if(sp.checked) x = x.replace(/[\s\-.]/g,'');
    if(!cs.checked) x = x.toUpperCase();
    return x;
  };

  function info(code){
    const c = eanCheck(code);
    const t = tipo(code.length);
    if(!code) return ['—','—'];
    if(c===null) return [t||`${code.length} caracteres`, 'Não verificável (formato não numérico ou tamanho incomum)'];
    return [t, c.ok ? 'Dígito verificador correto' : `Dígito verificador inválido (esperado ${c.expected})`];
  }

  function run(){
    const x = norm(a.value), y = norm(b.value);
    const res = $('#result',root), det = $('#details',root);
    if(!x && !y){
      res.innerHTML = `<div class="callout idle"><span class="e">⌨️</span><div><strong>Aguardando os dois códigos</strong><p>Preencha os campos A e B para comparar.</p></div></div>`;
      det.innerHTML=''; return;
    }
    if(!x || !y){
      res.innerHTML = `<div class="callout warn"><span class="e">✏️</span><div><strong>Falta um código</strong><p>Preencha o campo ${x?'B':'A'} para concluir a comparação.</p></div></div>`;
      det.innerHTML=''; return;
    }
    const igual = x===y;
    const n = Math.max(x.length,y.length);
    let first = -1, diffs = 0;
    for(let i=0;i<n;i++){ if(x[i]!==y[i]){ diffs++; if(first<0) first=i; } }

    if(igual){
      res.innerHTML = `<div class="callout ok"><span class="e">✅</span><div><strong>Os códigos são iguais</strong><p>${x.length} caracteres, todos coincidem.</p></div></div>`;
    } else {
      const lenMsg = x.length!==y.length ? ` Tamanhos diferentes: A tem ${x.length} e B tem ${y.length} caracteres.` : '';
      res.innerHTML = `<div class="callout bad"><span class="e">❌</span><div><strong>Os códigos são diferentes</strong><p>${diffs} ${diffs===1?'posição diverge':'posições divergem'}; a primeira é a posição ${first+1}.${lenMsg}</p></div></div>`;
    }

    const line = (tag,s,o)=>{
      let h=''; for(let i=0;i<n;i++){ const ch = s[i]===undefined?'·':s[i]; h += `<span class="ch${s[i]!==o[i]?' d':''}">${esc(ch)}</span>`; }
      return `<div class="ln"><span class="tag">${tag}</span>${h}</div>`;
    };
    const ia = info(x), ib = info(y);
    det.innerHTML = `
      <h2>Comparação caractere a caractere</h2>
      <div class="diff">${line('Código A',x,y)}${line('Código B',y,x)}</div>
      <h2>Detalhes</h2>
      <table>
        <tr><th></th><th>Código A</th><th>Código B</th></tr>
        <tr><td>Tamanho</td><td class="m">${x.length}</td><td class="m">${y.length}</td></tr>
        <tr><td>Tipo</td><td>${esc(ia[0])}</td><td>${esc(ib[0])}</td></tr>
        <tr><td>Verificação</td><td>${esc(ia[1])}</td><td>${esc(ib[1])}</td></tr>
      </table>`;
  }

  [a,b].forEach(el=>el.addEventListener('input',run));
  [sp,cs].forEach(el=>el.addEventListener('change',run));
  a.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); b.focus(); } });
  b.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); b.blur(); } });
  $('#swap',root).onclick=()=>{ const t=a.value; a.value=b.value; b.value=t; run(); };
  $('#clear',root).onclick=()=>{ a.value=''; b.value=''; run(); a.focus(); };
  run(); a.focus();
}

route();
</script>
</body>
</html>
